<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SDC Pattern Library</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Semi+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#F4F6F4;--surface:#FFFFFF;--ink:#16211D;--muted:#5C6B65;--line:#DCE3DF;
  --brand:#1B58A6;--brand-ink:#FFFFFF;
  --mat:#2E6A55;--mat-line:rgba(210,236,224,.16);--mat-line-strong:rgba(210,236,224,.34);
  --warn-bg:#FFF4DB;--warn-ink:#8A4B00;--warn-line:#F0CF8A;
  --sans:"Barlow",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --cond:"Barlow Semi Condensed","Arial Narrow",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#121815;--surface:#1A221E;--ink:#E7EEEA;--muted:#9AABA3;--line:#2C3833;
  --brand:#5B96E6;--brand-ink:#0C1420;--mat:#244F41;
  --warn-bg:#3A2A0C;--warn-ink:#F6CE84;--warn-line:#6A4A12;
}}
:root[data-theme="dark"]{
  --bg:#121815;--surface:#1A221E;--ink:#E7EEEA;--muted:#9AABA3;--line:#2C3833;
  --brand:#5B96E6;--brand-ink:#0C1420;--mat:#244F41;
  --warn-bg:#3A2A0C;--warn-ink:#F6CE84;--warn-line:#6A4A12;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 var(--sans);font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--brand);outline-offset:2px}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.top-in{max-width:1280px;margin:0 auto;padding:10px 20px;display:flex;gap:16px;align-items:center}
.mark{font:700 20px/1 var(--cond);letter-spacing:.01em;white-space:nowrap}
.mark span{color:var(--muted);font-weight:500}

/* product picker */
.picker{position:relative;flex:1;max-width:520px}
.picker input{width:100%;height:44px;border:1.5px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);
  padding:0 14px 0 40px;font:500 16px var(--sans)}
.picker input:focus{border-color:var(--brand);outline:none;background:var(--surface)}
.picker svg.ic{position:absolute;left:13px;top:13px;width:18px;height:18px;color:var(--muted)}
.drop{position:absolute;left:0;right:0;top:50px;background:var(--surface);border:1px solid var(--line);border-radius:12px;
  box-shadow:0 12px 32px rgba(10,30,20,.16);max-height:60vh;overflow:auto;padding:6px;display:none}
.drop.open{display:block}
.grp{font:600 13px var(--cond);color:var(--muted);padding:10px 10px 4px}
.opt{display:flex;justify-content:space-between;gap:12px;align-items:center;width:100%;border:0;background:none;text-align:left;
  padding:10px;border-radius:8px;cursor:pointer}
.opt:hover,.opt[aria-selected="true"]{background:var(--bg)}
.opt small{color:var(--muted)}
.none{padding:14px;color:var(--muted)}

main{max-width:1280px;margin:0 auto;padding:22px 20px 60px}
.empty{display:grid;place-items:center;text-align:center;min-height:60vh;gap:6px}
.empty h1{font:700 clamp(28px,4vw,40px)/1.1 var(--cond);margin:0}
.empty p{color:var(--muted);margin:0 0 14px;max-width:44ch}
.chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.chip{border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 16px;cursor:pointer;font-weight:500}
.chip:hover{border-color:var(--brand)}

.head{display:flex;flex-wrap:wrap;gap:16px;align-items:flex-end;justify-content:space-between;margin-bottom:18px}
.head h1{font:700 clamp(30px,4.2vw,46px)/1 var(--cond);margin:0 0 8px}
.meta{color:var(--muted);display:flex;flex-wrap:wrap;gap:6px 18px;font-size:15px}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:2px 10px;font-weight:600;font-size:14px}
.pill.draft{background:var(--warn-bg);color:var(--warn-ink)}
.btn{display:inline-flex;align-items:center;gap:8px;height:44px;padding:0 18px;border-radius:10px;border:0;cursor:pointer;font-weight:600;white-space:nowrap}
.btn.pri{background:var(--brand);color:var(--brand-ink)}
.btn.sec{background:transparent;border:1.5px solid var(--line)}
.btn.sec:hover{border-color:var(--brand)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.ttl{display:flex;gap:16px;align-items:center}
.hphoto{width:92px;height:92px;flex:none;border-radius:12px;background:#fff;border:1px solid var(--line);display:grid;place-items:center;padding:6px;cursor:zoom-in}
.hphoto img{max-width:100%;max-height:100%}
.fp{padding:0 16px 16px}
.fp figure{margin:0;background:#fff;border-radius:10px;border:1px solid var(--line);display:grid;place-items:center;padding:10px;min-height:160px}
.fp img{max-width:100%;max-height:220px}
.fp figcaption{font-size:13px;color:var(--muted);margin-top:6px}
.opt .ot{display:flex;align-items:center;gap:10px}
.oth{width:36px;height:36px;border-radius:6px;background:#fff;border:1px solid var(--line);display:grid;place-items:center;overflow:hidden;flex:none}
.oth img{max-width:100%;max-height:100%}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;width:min(640px,90vw);margin:0 auto}
.card{border:1.5px solid var(--line);background:var(--surface);border-radius:12px;padding:10px;cursor:pointer;text-align:center}
.card:hover{border-color:var(--brand)}
.card .im{background:#fff;border-radius:8px;height:120px;display:grid;place-items:center;margin-bottom:8px}
.card img{max-width:90%;max-height:110px}
.card span{font-weight:600}
dialog{border:0;border-radius:14px;padding:16px;background:#fff;max-width:92vw}
dialog img{display:block;max-width:80vw;max-height:70vh;min-width:220px;image-rendering:auto}
dialog::backdrop{background:rgba(10,20,15,.6)}
dialog button{margin-top:10px}
.status{font-size:14px;color:var(--muted);min-height:20px;margin-top:6px;text-align:right}

.work{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:20px;align-items:start}
@media (max-width:900px){.work{grid-template-columns:1fr}}
.matwrap{background:var(--mat);border-radius:14px;overflow:hidden;position:relative}
.matbar{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 14px;color:#E6F2EC;font-size:14px}
.seg{display:inline-flex;background:rgba(0,0,0,.22);border-radius:8px;padding:3px}
.seg button{border:0;background:none;color:#DCEBE3;padding:5px 12px;border-radius:6px;cursor:pointer;font-weight:500}
.seg button[aria-pressed="true"]{background:#F3F8F5;color:#15352A}
.mat{padding:4px 12px 14px;overflow-x:auto}
.mat svg{display:block;width:100%;height:auto;max-height:66vh}
.mat .gm{stroke:var(--mat-line);stroke-width:1}
.mat .gM{stroke:var(--mat-line-strong);stroke-width:1.4}
.mat .piece{fill-opacity:.9;stroke:#F6FBF8;stroke-width:3;stroke-linejoin:round}
.mat .dim{fill:#EAF5EF;font-family:var(--cond);font-weight:600;text-anchor:middle}
.mat .lay{cursor:pointer}
.mat .lay:hover .piece,.mat .lay:focus .piece{fill-opacity:1;stroke:#FFE58A;stroke-width:5}
.mat .lbl{fill:#fff;font-family:var(--cond);font-weight:600;text-anchor:middle;pointer-events:none}
.scalenote{color:#CFE3D8;font-size:13px;padding:0 14px 12px}

.detail{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px;margin-top:16px}
.detail h2{font:700 24px/1.15 var(--cond);margin:0 0 4px}
.dimline{color:var(--muted);margin:0 0 12px}
.cuts{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px}
.cut{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:8px;padding:5px 10px;font-weight:500}
.sw{width:14px;height:14px;border-radius:3px;flex:none}
.note{margin:8px 0;color:var(--ink)}
.flag{background:var(--warn-bg);color:var(--warn-ink);border:1px solid var(--warn-line);border-radius:10px;padding:10px 12px;margin:10px 0;font-size:15px}
.flag b{display:block;margin-bottom:2px}

.side{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.side h3,.panel h3{font:700 18px/1 var(--cond);margin:0;padding:16px 16px 10px}
.plist{list-style:none;margin:0;padding:0 8px 8px;max-height:70vh;overflow:auto}
.pbtn{display:grid;grid-template-columns:56px 1fr;gap:12px;align-items:center;width:100%;border:0;background:none;text-align:left;
  padding:8px;border-radius:10px;cursor:pointer}
.pbtn:hover{background:var(--bg)}
.pbtn[aria-current="true"]{background:var(--bg);box-shadow:inset 3px 0 0 var(--brand)}
.thumb{width:56px;height:56px;border-radius:8px;background:var(--mat);display:grid;place-items:center;padding:5px}
.thumb svg{max-width:100%;max-height:100%}
.thumb .piece{stroke:#fff;stroke-width:6}
.pbtn b{display:block;font-weight:600;line-height:1.25}
.pbtn small{color:var(--muted);display:block}
.pbtn .warn{color:var(--warn-ink);font-weight:600}

.below{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:20px;margin-top:20px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding-bottom:10px}
.tbl{overflow-x:auto;padding:0 16px}
table{border-collapse:collapse;width:100%;font-size:15px}
th{text-align:left;font-weight:600;color:var(--muted);font-size:13px;padding:6px 8px 6px 0;border-bottom:1px solid var(--line)}
td{padding:8px 8px 8px 0;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
td.n{text-align:right;font-weight:600}
.checks{margin:0;padding:0 16px 6px 36px}
.checks li{margin:0 0 10px}
.checks li b{font-weight:600}
@media (max-width:600px){.top-in{flex-wrap:wrap}.mark{width:100%}.picker{max-width:none}.head .acts{width:100%}.head .btn{width:100%;justify-content:center}.status{text-align:left}}
@media (prefers-reduced-motion:no-preference){.detail,.matwrap{transition:opacity .15s}}

.pill.ok{background:#DCF5E4;color:#14602F}
.actrow{display:flex;gap:10px;flex-wrap:wrap;justify-content:flex-end}
.btn.edit-on{background:#14602F;color:#fff}
.btn.sm{height:36px;padding:0 12px;font-size:14px}
.btn.ghost{background:none;color:var(--muted);text-decoration:underline;padding:0 8px}
.editbar{background:#DCF5E4;color:#14602F;border-radius:10px;padding:10px 14px;margin:-4px 0 16px;font-weight:500}
.row{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.fgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:14px;margin:6px 0 14px}
.detail label,.cform label{display:flex;flex-direction:column;gap:4px;font-weight:600;font-size:14px}
.detail label .u{font-weight:400;color:var(--muted)}
.detail label small{font-weight:400;color:var(--muted)}
.detail input,.cform input{height:42px;border:1.5px solid var(--line);border-radius:8px;padding:0 10px;font:500 16px var(--sans);background:var(--bg);color:var(--ink)}
.detail input:focus,.cform input:focus{border-color:var(--brand);outline:none;background:var(--surface)}
.detail label.full{margin-top:4px}
.ferr{color:#B91C1C;font-weight:600;min-height:1em;margin:8px 0 0}
.okbox{background:#DCF5E4;color:#14602F;border-radius:10px;padding:10px 12px;margin:10px 0;font-size:15px}
.okbox b{display:block}
.okay{color:#15803D;font-weight:600}
small.okay{display:block}
.muted{color:var(--muted)}
.pbtn small.muted{font-style:italic}
.card small{display:block;font-size:13px;margin-top:2px}
.wtxt{color:var(--warn-ink)}.otxt{color:#15803D}
.cform{background:var(--bg);border-radius:10px;padding:10px;margin-top:8px}
.done,.hist{list-style:none;margin:0;padding:0 16px 8px}
.done li,.hist li{padding:8px 0;border-bottom:1px solid var(--line)}
.done li:last-child,.hist li:last-child{border-bottom:0}
.done small,.hist small{color:var(--muted)}
.hist li{display:flex;flex-direction:column;gap:2px;font-size:15px}
.pad{padding:0 16px}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .pill.ok,:root:not([data-theme="light"]) .editbar,:root:not([data-theme="light"]) .okbox{background:#15342A;color:#9BE3B4}}
:root[data-theme="dark"] .pill.ok,:root[data-theme="dark"] .editbar,:root[data-theme="dark"] .okbox{background:#15342A;color:#9BE3B4}

.topacts{display:flex;gap:8px;margin-left:auto}
.home{text-align:center;padding:8vh 0 20px}
.home h1{font:700 clamp(28px,4vw,40px)/1.1 var(--cond);margin:0 0 6px}
.home h2{font:700 20px var(--cond);margin:36px 0 12px}
.home .muted{margin:0 0 16px}
.chip small{color:var(--muted);font-weight:500;margin-left:4px}
.center{text-align:center;margin-top:18px}
.linkbtn{background:none;border:0;color:var(--brand);font-weight:600;cursor:pointer;padding:6px 2px;font-size:15px}
.linkbtn.danger,.btn.ghost.danger{color:#B91C1C}
.btn.danger-bg{background:#B91C1C;color:#fff}
.iconbtn{background:none;border:1.5px solid var(--line);border-radius:8px;width:36px;height:36px;cursor:pointer;font-size:18px;line-height:1;color:var(--muted);flex:none}
.small{font-size:13px}
.formhead h1{font:700 clamp(28px,4vw,40px)/1.1 var(--cond);margin:0 0 6px}
.formhead p{margin:0 0 18px;max-width:70ch}
.fsec{margin:0 0 20px}
.sech{font:700 24px/1.15 var(--cond);margin:8px 0 12px}
.detail select,.pc select,.srow input,.pc input{height:42px;border:1.5px solid var(--line);border-radius:8px;padding:0 10px;font:500 16px var(--sans);background:var(--bg);color:var(--ink);min-width:0}
.detail select:focus,.pc select:focus,.srow input:focus,.pc input:focus{border-color:var(--brand);outline:none;background:var(--surface)}
.pc{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 18px 10px;margin:0 0 14px}
.pc legend{font:700 16px var(--cond);padding:0 6px;color:var(--muted)}
.pc label{display:flex;flex-direction:column;gap:4px;font-weight:600;font-size:14px}
.pc-grid{display:grid;grid-template-columns:minmax(0,1fr) 190px;gap:18px}
@media (max-width:700px){.pc-grid{grid-template-columns:1fr}}
.pc-main{display:flex;flex-direction:column;gap:12px}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.dims{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px}
.nu{display:flex;gap:6px}.nu input{flex:1;width:100%}.nu select{width:84px;flex:none}
.pc-prev{background:var(--mat);border-radius:10px;display:grid;place-items:center;padding:12px;min-height:170px;text-align:center}
.pc-prev svg{max-width:100%;max-height:220px}
.pc-prev .piece{stroke:#fff;stroke-width:4}
.pc-prev .small{color:#DCEBE3}
.mats{display:flex;flex-direction:column;gap:8px;align-items:flex-start}
.lbl2{font-weight:600;font-size:14px}
.mrow,.srow{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.mrow select{min-width:180px}
.qty{width:72px}
.srow{margin:0 0 8px}.srow input:not(.qty){flex:1;min-width:160px}
.pc-acts{display:flex;gap:14px;flex-wrap:wrap;border-top:1px solid var(--line);margin-top:12px;padding-top:4px}
.photoRow{display:flex;gap:16px;align-items:center;margin-top:14px}
.phbox{width:110px;height:110px;border:1px solid var(--line);border-radius:10px;background:#fff;display:grid;place-items:center;overflow:hidden;flex:none}
.phbox img{max-width:100%;max-height:100%}
.filebtn{cursor:pointer}
.formfoot{position:sticky;bottom:env(safe-area-inset-bottom,0px);background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 16px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;box-shadow:0 -4px 18px rgba(10,30,20,.08)}
.formfoot .status{margin:0 0 0 auto;text-align:left}
.flag ul{margin:6px 0 0;padding-left:20px}
.dlgh{font:700 20px var(--cond);margin:0 0 6px}
.dlgp{margin:0 0 6px;max-width:44ch;color:#333}
@media (max-width:600px){.topacts{margin-left:0;width:100%}}

.imp{background:var(--surface);border:1.5px dashed var(--line);border-radius:14px;padding:14px 18px;margin:0 0 14px}
.imp-head{display:flex;gap:14px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.imp-head p{margin:2px 0 0;max-width:60ch}
.impgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px;margin:12px 0}
.impc{border:1.5px solid var(--line);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:6px;opacity:.6}
.impc.on{opacity:1;border-color:var(--brand)}
.impc label{display:flex;flex-direction:column;gap:3px;font-weight:600;font-size:13px}
.impc input:not([type=checkbox]){height:38px;border:1.5px solid var(--line);border-radius:8px;padding:0 8px;font:500 15px var(--sans);background:var(--bg);color:var(--ink)}
.impc small{color:var(--muted)}.impc small.warn{color:var(--warn-ink)}
.impchk{flex-direction:row!important;align-items:center;gap:8px!important}
.impchk input{width:20px;height:20px}
.impth{background:var(--mat);border-radius:8px;height:130px;display:grid;place-items:center;padding:8px}
.impth svg{max-width:100%;max-height:114px}
.impth .piece{stroke:#fff;stroke-width:3}
.tag{background:var(--bg);border-radius:999px;padding:2px 10px;font-weight:600;font-size:13px}
.impscale{display:flex;gap:14px;align-items:flex-end;flex-wrap:wrap;margin-bottom:6px}
.impscale label{display:flex;flex-direction:column;gap:3px;font-weight:600;font-size:13px}
.impscale input{width:90px;height:38px;border:1.5px solid var(--line);border-radius:8px;padding:0 8px;font:500 15px var(--sans);background:var(--bg);color:var(--ink)}
.impscale p{margin:0;max-width:52ch}

a.mark{color:inherit;text-decoration:none}
a.mark:hover span{color:var(--brand)}
.backlink{display:inline-block;color:var(--brand);font-weight:600;text-decoration:none;margin-bottom:8px;font-size:15px}
.backlink:hover{text-decoration:underline}
.home{text-align:left;padding:10px 0 20px}
.homehead{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:14px}
.homehead h1{margin:0 0 4px}
.homehead .muted{margin:0}
.catnav{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 8px;position:sticky;top:calc(env(safe-area-inset-top,0px) + 65px);background:var(--bg);padding:8px 0;z-index:5}
.catnav .chip{text-decoration:none;color:var(--ink)}
.catsec{margin-top:22px;scroll-margin-top:130px}
.catsec h2{font:700 24px var(--cond);margin:0 0 12px;text-align:left}
.catsec h2 small{color:var(--muted);font:500 16px var(--sans);margin-left:6px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:14px}
.pcard{border:1.5px solid var(--line);background:var(--surface);border-radius:14px;padding:10px;cursor:pointer;text-align:center;display:flex;flex-direction:column;gap:4px;align-items:stretch}
.pcard:hover,.pcard:focus-visible{border-color:var(--brand);box-shadow:0 6px 18px rgba(10,30,20,.10)}
.pcard .im{background:#fff;border-radius:10px;height:160px;position:relative;overflow:hidden;margin-bottom:4px}
.pcard img{position:absolute;inset:8%;width:84%;height:84%;object-fit:contain}
.pcard .noph{position:absolute;inset:15%}
.pcard .noph{display:grid;place-items:center;background:var(--mat);border-radius:8px;padding:10px}
.pcard .noph svg{max-width:100%;max-height:100%}
.pcard .noph .piece{stroke:#fff;stroke-width:4}
.pcard .pn{font-weight:600;line-height:1.25}
.pcard small{color:var(--muted)}
@media (max-width:600px){.pcard .im{height:130px}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.catnav{top:calc(env(safe-area-inset-top,0px) + 108px)}}
.dlgin{width:100%;height:44px;border:1.5px solid #ccd;border-radius:8px;padding:0 10px;font:500 16px var(--sans);margin:4px 0}
</style>
</head>
<body>
<header class="top"><div class="top-in">

  /* ---------- geometry: polygon in inches, origin bottom-left, y up ---------- */
  function arc(cx, cy, r, a0, a1, n) {
    const pts = [];
    for (let i = 0; i <= n; i++) {
      const a = a0 + (a1 - a0) * (i / n);
      pts.push([cx + r * Math.cos(a), cy + r * Math.sin(a)]);
    }
    return pts;
  }
  function outline(p) {
    const w = toIn(p.w), h = toIn(p.h), s = p.shape;
    switch (s.type) {
      case 'archTop': {
        const rx = w / 2, ry = s.ah ? Math.min(toIn(s.ah), h) : rx, yb = h - ry, pts = [];
        for (let i = 1; i < 48; i++) { const a = Math.PI * i / 48; pts.push([rx + rx * Math.cos(a), yb + ry * Math.sin(a)]); }
        return [[0, 0], [w, 0], [w, yb], ...pts, [0, yb]];
      }
      case 'notchBottom': {
        const nw = toIn(s.nw), nh = toIn(s.nh);
        return [[0, nh], [nw, nh], [nw, 0], [w - nw, 0], [w - nw, nh], [w, nh], [w, h], [0, h]];

        const hits = texts.filter((t) => inside(t.at, s.pts) && !shapes.some((o) => o !== s && o.area < s.area && inside(t.at, o.pts)));
        hits.forEach((t) => used.add(t));
        s.label = hits.map((t) => t.str).join(' ');
      });
      const heads = texts.filter((t) => !used.has(t) && !shapes.some((sh) => inside(t.at, sh.pts)) && /size|^\d+\s*[,.)]/i.test(t.str) && !/^\d+\s*:\s*\d+/.test(t.str));
      shapes.forEach((s) => {
        const cy = (s.bb.y0 + s.bb.y1) / 2;
        const hd = heads.filter((t) => t.at[1] > cy).sort((a, b) => a.at[1] - b.at[1])[0];
        s.group = hd ? parseLabel(hd.str).name : '';
      });
      // an outline that only frames another shape of the same box (grid frame) is noise
      const isRect = (s) => s.pts.length === 4;
      shapes = shapes.filter((s) => !(isRect(s) && shapes.some((o) => o !== s && !isRect(o) && Math.abs(o.bb.x0 - s.bb.x0) < 0.05 && Math.abs(o.bb.x1 - s.bb.x1) < 0.05 && Math.abs(o.bb.y0 - s.bb.y0) < 0.05 && Math.abs(o.bb.y1 - s.bb.y1) < 0.05)));
      // an outline around another shape is probably a seam allowance line
      shapes.forEach((s) => { s.outer = shapes.some((o) => o !== s && o.area < s.area && inside(o.pts[0], s.pts) && o.bb.x0 > s.bb.x0 && o.bb.x1 < s.bb.x1); });
      // reading order: top to bottom, left to right
      shapes.sort((a, b) => (Math.abs(b.bb.y1 - a.bb.y1) > 1.5 ? b.bb.y1 - a.bb.y1 : a.bb.x0 - b.bb.x0));
      shapes.forEach((s) => {
        const L = parseLabel(s.label || '');
        const {x0, y0, w, h} = s.bb;
        cands.push({page: n, group: s.group, name: L.name, qty: L.qty, wIn: w, hIn: h, outer: s.outer,
          norm: s.pts.map(([x, y]) => [+((x - x0) / w).toFixed(4), +((y - y0) / h).toFixed(4)])});
      });
    }
    return {pages: pdf.numPages, candidates: cands};
  }

  const api = {importPDF, parseLabel};
  if (typeof module !== 'undefined' && module.exports) module.exports = api; else root.PatternImport = api;
})(typeof window !== 'undefined' ? window : globalThis);

<script>

/* ---------- Supabase backend ---------- */
const CFG = window.PATTERN_CONFIG || {};
const TABLE = 'docs', BUCKET = 'photos';
let sb = null, configMissing = false;
function makeDb(){
  const url = (CFG.supabaseUrl || '').trim(), key = (CFG.supabaseKey || '').trim();
  if (!url || !key || /PASTE/i.test(url + key)) { configMissing = true; return null; }
  if (!window.supabase) return null;
  sb = window.supabase.createClient(url, key);
  /* Data use is kept low: each browser keeps a copy of the data, asks the server only
     "what changed since last time" (a few KB), and downloads only the changed rows. */
  const CACHE = 'patternlib.cache.v1.';
  const caches = {}, subs = {};
  const cacheOf = name => {
    if (!caches[name]) {
      let m = new Map();
      try { const raw = localStorage.getItem(CACHE + name); if (raw) m = new Map(JSON.parse(raw)); } catch(e) {}
      caches[name] = m;
    }
    return caches[name];
  };
  const save = name => { try { localStorage.setItem(CACHE + name, JSON.stringify([...cacheOf(name)])); } catch(e) {} };
  const emit = name => (subs[name] || []).forEach(f => f());
  const headLimit = {log: 300};
  async function sync(name){
    let q = sb.from(TABLE).select('id,updated_at').eq('collection', name);
    if (headLimit[name]) q = q.order('updated_at', {ascending: false}).limit(headLimit[name]);
    const {data: heads, error} = await q;
    if (error) throw error;
    const m = cacheOf(name), seen = new Set(), need = [];
    heads.forEach(h => { seen.add(h.id); const c = m.get(h.id); if (!c || c.updated_at !== h.updated_at) need.push(h.id); });
    [...m.keys()].forEach(id => { if (!seen.has(id)) m.delete(id); });
    for (let i = 0; i < need.length; i += 100) {
      const {data, error: e2} = await sb.from(TABLE).select('id,data,updated_at').eq('collection', name).in('id', need.slice(i, i + 100));
      if (e2) throw e2;
      data.forEach(r => m.set(r.id, {data: r.data, updated_at: r.updated_at}));
    }
    save(name); emit(name);
  }
  const syncAll = () => Object.keys(subs).forEach(n => sync(n).catch(() => {}));
  sb.channel('docs-changes').on('postgres_changes', {event: '*', schema: 'public', table: TABLE}, p => {
    const row = p.eventType === 'DELETE' ? p.old : p.new;
    if (!row || !row.collection || !subs[row.collection]) { syncAll(); return; }
    const m = cacheOf(row.collection);
    if (p.eventType === 'DELETE') m.delete(row.id);
    else if (row.data === undefined) { sync(row.collection).catch(() => {}); return; }
    else m.set(row.id, {data: row.data, updated_at: row.updated_at});
    save(row.collection); emit(row.collection);
  }).subscribe();
  setInterval(syncAll, 5 * 60 * 1000);                       // light "anything new?" check
  document.addEventListener('visibilitychange', () => { if (!document.hidden) syncAll(); });
  function collection(name, opts){
    opts = opts || {};
    return {
      doc: id => ({
        set: async data => {
          const updated_at = new Date().toISOString();
          const {error} = await sb.from(TABLE).upsert({collection: name, id, data, updated_at});
          if (error) throw error;
          cacheOf(name).set(id, {data, updated_at}); save(name); emit(name);
        },
        delete: async () => {
          const {error} = await sb.from(TABLE).delete().eq('collection', name).eq('id', id);
          if (error) throw error;
          cacheOf(name).delete(id); save(name); emit(name);
        },
      }),
      orderBy: () => collection(name, Object.assign({}, opts, {newest: true})),
      limit: n => collection(name, Object.assign({}, opts, {limit: n})),
      onSnapshot(cb, err){
        const deliver = () => {
          let rows = [...cacheOf(name)].map(([id, v]) => ({id, data: v.data, updated_at: v.updated_at}));
          if (opts.newest) rows.sort((a, b) => (a.updated_at < b.updated_at ? 1 : -1));
          cb({docs: rows.slice(0, opts.limit || 100000).map(r => ({id: r.id, data: () => r.data}))});
        };
        (subs[name] = subs[name] || []).push(deliver);
        if (cacheOf(name).size) deliver();                    // show the saved copy at once
        sync(name).catch(e => { if (err) err(e); });
      },
    };
  }
  return {collection};
}
const storageApi = {
  upload: async (blob) => {
    const path = 'p-' + Date.now() + '-' + Math.random().toString(36).slice(2, 8) + '.jpg';
    const {error} = await sb.storage.from(BUCKET).upload(path, blob, {contentType: 'image/jpeg'});
    if (error) throw error;

/* ---------- who is editing (no login: a name remembered on this device) ---------- */

/* ---------- picker ---------- */
const q = $('#q'), drop = $('#drop');

function openDrop(){
  const t = q.value.trim().toLowerCase();
  const list = PRODS.filter(p => (!t || (p.name + ' ' + p.category).toLowerCase().includes(t)) && (!catFilter || p.category === catFilter));
  const cats = [...new Set(list.map(p => p.category))].sort();
  shown = cats.flatMap(c => list.filter(p => p.category === c));
  let h = catFilter ? `<div class="grp">Category: ${esc(catFilter)} <button class="linkbtn" data-clearcat>Show all</button></div>` : '';

/* ---------- layout of all pieces ---------- */
function layoutSVG(prod){
  const unit = prod.unit, gap = unit === 'cm' ? 3/2.54 : 1.2;
  const items = prod.pieces.map(p => ({p, w:E.toIn(p.w), h:E.toIn(p.h)}));
  const maxW = Math.max(40/(unit==='cm'?2.54:1), ...items.map(i=>i.w));
  const order = [...items].sort((a,b)=>b.h-a.h);
  let x=gap, y=gap, rowH=0, W=0;
  order.forEach(it => {
    if (x + it.w + gap > maxW + gap*2 && x > gap) { x = gap; y += rowH + gap; rowH = 0; }
    it.x = x; it.y = y; x += it.w + gap; rowH = Math.max(rowH, it.h); W = Math.max(W, x);
  });
  const H = y + rowH + gap, S = 40, step = unit==='cm' ? 1/2.54 : 1;
  let g = '';
  for (let v=0; v<=W; v+=step) g += `<line x1="${v*S}" y1="0" x2="${v*S}" y2="${H*S}" class="gm"/>`;
  for (let v=0; v<=H; v+=step) g += `<line x1="0" y1="${v*S}" x2="${W*S}" y2="${v*S}" class="gm"/>`;
  let out = '';
  order.forEach(it => {
    const pts = E.outline(it.p).map(([px,py]) => ((it.x+px)*S).toFixed(1)+','+((it.y+it.h-py)*S).toFixed(1)).join(' ');
    const col = it.p.cuts.length ? E.mat(it.p.cuts[0][0]).color : '#8A8F8C';
    const fs = Math.max(24, Math.min(46, Math.min(it.w, it.h)*S*0.3));
    const rot = it.w < 1.6 && it.h > it.w*2;
    const fs2 = Math.min(fs, ((rot?it.h:it.w)*S*0.9)/(Math.max(it.p.name.length,3)*0.56));
    const cx = (it.x+it.w/2)*S, cy = (it.y+it.h/2)*S;
    out += `<g class="lay" tabindex="0" role="button" data-pid="${it.p.id}" aria-label="${esc(it.p.name)}">
      <polygon points="${pts}" fill="${col}" class="piece"/>
      <text class="lbl" font-size="${fs2.toFixed(0)}" ${rot?`transform="rotate(-90 ${cx} ${cy})"`:''} x="${cx}" y="${cy+fs2*0.35}">${esc(it.p.name)}</text></g>`;
  });
  return `<svg viewBox="0 0 ${(W*S).toFixed(0)} ${(H*S).toFixed(0)}" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="All pieces at the same scale"><g>${g}</g>${out}</svg>`;
}

/* ---------- geometry checks ---------- */
function fieldsFor(p){
  const f = [{k:'w', label:'Width', d:p.w}, {k:'h', label:'Height', d:p.h}];
  const s = p.shape;
  if (s.type === 'archTop') f.push({k:'shape.ah', label:'Curve height (top)', d:s.ah || {v:+(p.w.v/2).toFixed(3), u:p.w.u}, hint:'Half circle = half the width'});
  if (s.type === 'notchBottom') { f.push({k:'shape.nw', label:'Corner cut-out width', d:s.nw}); f.push({k:'shape.nh', label:'Corner cut-out height', d:s.nh}); }
  if (s.type === 'rect' || s.type === 'roundBottom') f.push({k:'shape.r', label:'Bottom corner radius', d:s.r || {v:0, u:p.w.u}, hint:'0 = square corners'});
  if (s.type === 'trapezoid' || s.type === 'hexagon') f.push({k:'shape.top', label:'Top width', d:s.top});
  return f;
}
function geomError(shape, inch, name){
  const W = inch.w, H = inch.h, pre = name ? name + ': ' : '';
  if (!(W > 0 && H > 0)) return pre + 'width and height must be more than 0.';
  if (shape === 'notchBottom' && !(inch.nw > 0 && inch.nh > 0)) return pre + 'enter both cut-out sizes.';
  if (shape === 'notchBottom' && inch.nw * 2 >= W) return pre + 'the two corner cut-outs together are wider than the piece.';
  if (shape === 'notchBottom' && inch.nh >= H) return pre + 'the corner cut-out is taller than the piece.';
  if (shape === 'archTop' && inch.ah > H) return pre + 'the curve height cannot be more than the piece height.';
  if ((shape === 'rect' || shape === 'roundBottom') && inch.r && (inch.r * 2 > W || inch.r > H)) return pre + 'the corner radius is too big (max half the width).';
  if (shape === 'roundBottom' && !(inch.r > 0)) return pre + 'enter the corner radius.';
  if ((shape === 'trapezoid' || shape === 'hexagon') && !(inch.top > 0 && inch.top <= W)) return pre + 'the top width must be more than 0 and not more than the full width.';
  return '';
}

/* ---------- writes ---------- */
async function me(){ return getName() || await askName() || 'Unknown'; }
const docId = (a, b) => (a + '__' + b).replace(/[^A-Za-z0-9_\-.~:@+]/g, '-');

  await db.collection('log').doc(Date.now() + '-' + Math.random().toString(36).slice(2,7)).set({pid, text, by, at});
}
async function savePiece(prod, pieceId, values, note){
  const base = baseOf(prod.id).pieces.find(p => p.id === pieceId);
  const by = await me(), at = new Date().toISOString();
  const rec = {pid: prod.id, pieceId, by, at, note: note || ''};
  const cuts = {}; const changed = [];
  fieldsFor(base).forEach(f => {
    const v = values[f.k]; if (v == null || isNaN(v)) return;
    const orig = f.d.v;
    if (Math.abs(v - orig) <= 1e-9) return;
    changed.push(`${f.label} ${E.fmt({v:orig, u:f.d.u})} to ${E.fmt({v, u:f.d.u})}`);
    const d = {v, u:f.d.u};
    if (f.k === 'w' || f.k === 'h') rec[f.k] = d; else { rec.shape = rec.shape || {}; rec.shape[f.k.slice(6)] = d; }
  });
  base.cuts.forEach(([m, n]) => {
    const v = values['cut.' + m]; if (v == null || isNaN(v)) return;
    if (v !== n) { cuts[m] = v; changed.push(`${E.mat(m).name} qty ${n} to ${v}`); }
  });
  if (Object.keys(cuts).length) rec.cuts = cuts;
  const ref = db.collection('overrides').doc(docId(prod.id, pieceId));
  if (!rec.w && !rec.h && !rec.shape && !rec.cuts) await ref.delete(); else await ref.set(rec);
  const piece = prod.pieces.find(p => p.id === pieceId);
  const summary = changed.length ? changed.join('; ') : 'values set back to the original';
  await addLog(prod.id, `${piece.name}: ${summary}${note ? ' (' + note + ')' : ''}`);
  if (piece.flag && !ckFor(prod.id)[pieceId]) {
    await db.collection('checks').doc(docId(prod.id, pieceId)).set({pid: prod.id, key: pieceId, status: 'corrected', note: note || summary, by, at});
  }
}
async function confirmCheck(prod, c, note){
  const by = await me(), at = new Date().toISOString();
  await db.collection('checks').doc(docId(prod.id, c.key)).set({pid: prod.id, key: c.key, status:'confirmed', note: note || '', by, at});
  await addLog(prod.id, `${c.name}: confirmed as drawn${note ? ' (' + note + ')' : ''}`);
}
async function reopenCheck(prod, c){
  await db.collection('checks').doc(docId(prod.id, c.key)).delete();
  await addLog(prod.id, `${c.name}: reopened`);
}
async function guarded(fn){
  if (busy) return false; busy = true; setStatus('Saving...');
  try { await fn(); setStatus('Saved.'); return true; }
  catch(e){ const m = String((e && e.message) || ''); setStatus(/security|policy|permission/i.test(m) ? 'Not saved: the database refused the change. Ask the admin to check setup step 2.' : 'Not saved. Check your internet connection and try again.'); return false; }
  finally { busy = false; }
}
function setStatus(t){ const s = $('#st'); if (s) s.textContent = t; }
function confirmDialog(title, body, action, fn, danger){
  const d = document.createElement('dialog');
  d.innerHTML = `<h3 class="dlgh"></h3><p class="dlgp"></p><div class="row"><button class="btn pri ${danger === false ? '' : 'danger-bg'}" data-ok></button><button class="btn sec" data-no>Cancel</button></div>`;
  d.querySelector('.dlgh').textContent = title; d.querySelector('.dlgp').textContent = body; d.querySelector('[data-ok]').textContent = action;
  document.body.appendChild(d); d.showModal();
  d.querySelector('[data-no]').onclick = () => d.close();
  d.querySelector('[data-ok]').onclick = () => { d.close(); fn(); };
  d.addEventListener('close', () => d.remove());
}

const rid = () => Math.random().toString(36).slice(2, 8);
const slug = s => String(s).toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '').slice(0, 40) || 'product';
function parseNum(str){
  if (str == null) return NaN;
  let s = String(str).trim().replace(',', '.').replace(/(["″”]|inch(es)?|in|cm)$/i, '').trim();
  s = s.replace(/½/g,' 1/2').replace(/¼/g,' 1/4').replace(/¾/g,' 3/4').trim();
  if (!s) return NaN;
  let m = s.match(/^(\d+(?:\.\d+)?)\s+(\d+)\/(\d+)$/); if (m && +m[3]) return +m[1] + (+m[2]) / (+m[3]);
  m = s.match(/^(\d+)\/(\d+)$/); if (m && +m[2]) return (+m[1]) / (+m[2]);
  return /^\d+(\.\d+)?$/.test(s) ? +s : NaN;
}
const dimStr = d => d ? E.fmt(d).replace(/"$/, '').replace(/ cm$/, '') : '';
function emptyPiece(unit){ return {id: 'p' + rid(), name:'', shape:'rect', w:{s:'',u:unit}, h:{s:'',u:unit}, params:{}, cuts:[{m:'kitenge', q:'1'}], note:'', flag:''}; }
function toDraft(p){
  if (!p) return {mode:'new', name:'', category:'', unit:'in', source:'', photo:null, newPhoto:null,
    pieces:[emptyPiece('in')], sub:[], flags:[], materials:{}, errors:[]};
  return {mode:'edit', id:p.id, name:p.name, category:p.category, unit:p.unit, source:p.source || '', photo:p.photo || null, newPhoto:null,
    pieces: p.pieces.map(x => {
      const params = {};
      (SHAPES[x.shape.type] || SHAPES.rect).params.forEach(([k]) => { if (x.shape[k]) params[k] = {s: dimStr(x.shape[k]), u: x.shape[k].u}; });
      return {id:x.id, name:x.name, shape: SHAPES[x.shape.type] ? x.shape.type : 'rect', w:{s:dimStr(x.w), u:x.w.u}, h:{s:dimStr(x.h), u:x.h.u}, params,
        cuts: x.cuts.map(([m, n]) => ({m, q: String(n)})), note: x.note || '', flag: x.flag || '', pts: x.shape.type === 'custom' ? x.shape.pts : undefined};
    }),
    sub: (p.sub || []).map(([n, s, q]) => ({n, s, q:String(q)})),
    flags: (p.flags || []).slice(), materials: Object.assign({}, p.materials || {}), errors:[], createdAt: p.createdAt, createdBy: p.createdBy};

function inchOf(dp){
  const k = u => u === 'cm' ? 1/2.54 : 1;
  const r = {w: parseNum(dp.w.s) * k(dp.w.u), h: parseNum(dp.h.s) * k(dp.h.u)};
  SHAPES[dp.shape].params.forEach(([key]) => { const p = dp.params[key]; r[key] = p && p.s ? parseNum(p.s) * k(p.u) : NaN; });
  return r;
}
function draftPiece(dp){
  const w = parseNum(dp.w.s), h = parseNum(dp.h.s);
  if (!(w > 0 && h > 0)) return null;
  if (geomError(dp.shape, inchOf(dp), '')) return null;
  const shape = {type: dp.shape};
  if (dp.shape === 'custom') shape.pts = dp.pts;
  SHAPES[dp.shape].params.forEach(([k]) => { const v = parseNum(dp.params[k] && dp.params[k].s); if (v > 0) shape[k] = {v, u: dp.params[k].u}; });
  const m = dp.cuts[0] && dp.cuts[0].m !== '__new' ? dp.cuts[0].m : 'x';
  return {id: dp.id, name: dp.name || 'Piece', w:{v:w, u:dp.w.u}, h:{v:h, u:dp.h.u}, shape, cuts: [[m, 1]]};
}

function setPath(obj, path, val){
  const ks = path.split('.'); let o = obj;
  for (let i = 0; i < ks.length - 1; i++) { const k = /^\d+$/.test(ks[i]) ? +ks[i] : ks[i]; if (o[k] == null) o[k] = {}; o = o[k]; }
  o[ks[ks.length - 1]] = val;
}

async function shrink(file){
  const url = URL.createObjectURL(file);
  try {
    const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = url; });
    const k = Math.min(1, 800 / Math.max(img.width, img.height));
    const c = document.createElement('canvas'); c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
    const g = c.getContext('2d'); g.fillStyle = '#fff'; g.fillRect(0, 0, c.width, c.height); g.drawImage(img, 0, 0, c.width, c.height);
    return await new Promise(res => c.toBlob(res, 'image/jpeg', 0.85));
  } finally { URL.revokeObjectURL(url); }
}
function buildProduct(){
  const d = draft, errs = [];
  if (!d.name.trim()) errs.push('Enter a product name.');
  if (!d.category.trim()) errs.push('Enter a category.');
  const dup = PRODS.find(p => p.name.trim().toLowerCase() === d.name.trim().toLowerCase() && p.id !== d.id);
  if (dup) errs.push(`A product called "${dup.name}" already exists.`);
  const materials = Object.assign({}, d.materials);
  const pieces = d.pieces.map((dp, i) => {
    const nm = dp.name.trim() || `Piece ${i + 1}`;
    if (!dp.name.trim()) errs.push(`Piece ${i + 1}: enter a piece name.`);
    const w = parseNum(dp.w.s), h = parseNum(dp.h.s);
    if (!(w > 0) || !(h > 0)) { errs.push(`${nm}: enter width and height as numbers (e.g. 13, 6.75 or 6 3/4).`); return null; }
    let paramErr = false;
    SHAPES[dp.shape].params.forEach(([k, label, optional]) => {
      const raw = dp.params[k] && dp.params[k].s;
      if (!optional && !(parseNum(raw) > 0)) { errs.push(`${nm}: enter ${label.toLowerCase()}.`); paramErr = true; }
      if (optional && raw && !(parseNum(raw) > 0)) { errs.push(`${nm}: ${label.toLowerCase()} must be a number.`); paramErr = true; }
    });
    if (!paramErr) { const ge = geomError(dp.shape, inchOf(dp), nm); if (ge) errs.push(ge); }
    const cuts = [];
    dp.cuts.forEach(c => {
      const q = Number(c.q);
      if (!Number.isInteger(q) || q < 1) { errs.push(`${nm}: quantities must be whole numbers of 1 or more.`); return; }
      let key = c.m;
      if (key === '__new') {
        const n = (c.newName || '').trim();
        if (!n) { errs.push(`${nm}: enter the new material name.`); return; }
        const found = Object.entries(Object.assign({}, E.MAT, materials)).find(([, m]) => m.name.toLowerCase() === n.toLowerCase());
        key = found ? found[0] : 'm-' + slug(n);
        if (!found) materials[key] = {name: n, color: NEW_COLORS[Object.keys(materials).length % NEW_COLORS.length]};
      }
      const ex = cuts.find(x => x[0] === key); if (ex) ex[1] += q; else cuts.push([key, q]);
    });
    if (!cuts.length) errs.push(`${nm}: add at least one material.`);
    const shape = {type: dp.shape};
    if (dp.shape === 'custom') { if (dp.pts) shape.pts = dp.pts; else errs.push(`${nm}: the imported shape is missing. Choose another shape or import again.`); }
    SHAPES[dp.shape].params.forEach(([k]) => { const p = dp.params[k]; const v = p ? parseNum(p.s) : NaN; if (v > 0) shape[k] = {v, u: p.u}; });
    const out = {id: dp.id, name: nm, w: {v: w, u: dp.w.u}, h: {v: h, u: dp.h.u}, shape, cuts};
    if (dp.note.trim()) out.note = dp.note.trim();
    if (dp.flag.trim()) out.flag = dp.flag.trim();
    if (dp.shape === 'archTop' && !shape.ah) out.approx = true;
    return out;
  });
  if (new Set(d.pieces.map(p => p.name.trim().toLowerCase()).filter(Boolean)).size < d.pieces.filter(p => p.name.trim()).length) errs.push('Two pieces have the same name. Give each piece its own name.');
  const sub = d.sub.filter(s => s.n.trim() || s.s.trim()).map(s => {
    const q = Number(s.q || 1); if (!Number.isInteger(q) || q < 1) errs.push(`Sub material "${s.n}": quantity must be a whole number.`);
    return [s.n.trim(), s.s.trim(), q];
  });
  const flags = d.flags.map(f => f.trim()).filter(Boolean);
  if (d.mode === 'new') flags.unshift('New entry: check every value against the product sheet or a sample before cutting.');
  const used = new Set(pieces.filter(Boolean).flatMap(p => p.cuts.map(c => c[0])));
  Object.keys(materials).forEach(k => { if (!used.has(k)) delete materials[k]; });
  const product = {id: d.id || slug(d.name) + '-' + rid().slice(0, 4), name: d.name.trim(), category: d.category.trim(), unit: d.unit,
    source: d.source.trim(), status: 'draft', pieces: pieces.filter(Boolean), sub, flags, materials};
  if (d.newPhoto) product.photo = {path: d.newPhoto.path, url: d.newPhoto.url}; else if (d.photo) product.photo = d.photo;
  return {errs: [...new Set(errs)], product};
}
async function saveProduct(){
  const {errs, product} = buildProduct();
  if (errs.length) { draft.errors = errs; renderForm(); window.scrollTo({top:0}); return; }
  const oldPhoto = draft.mode === 'edit' && draft.newPhoto && draft.photo ? draft.photo.path : null;
  const by = await me(), at = new Date().toISOString();
  product.updatedBy = by; product.updatedAt = at;
  product.createdAt = draft.createdAt || at; product.createdBy = draft.createdBy || by;
  const mode = draft.mode;
  const ok = await guarded(async () => {
    await db.collection('products').doc(product.id).set(product);
    await addLog(product.id, mode === 'new' ? `Product created with ${product.pieces.length} pieces` : 'Product details edited');
  });
  if (!ok) return;
  if (oldPhoto && assetsNs) { try { await assetsNs.delete(oldPhoto); } catch(e){} }
  const idx = PRODS.findIndex(p => p.id === product.id);
  PRODS = idx >= 0 ? PRODS.map(p => p.id === product.id ? product : p) : PRODS.concat([product]);
  Object.entries(product.materials).forEach(([k, m]) => { if (!E.MAT[k]) E.MAT[k] = m; });
  view = 'product'; draft = null; curId = product.id; sel = null; render(); window.scrollTo({top:0});
  setStatus(mode === 'new' ? 'Product created. It stays Draft until its checks are confirmed.' : 'Product saved.');
}

function wireImport(){
  const app = $('#app');
  const inp = $('#impIn');
  if (inp) inp.onchange = async () => {
    const f = inp.files && inp.files[0]; if (!f) return;
    draft.imp = {file: f.name, loading: true, cands: [], scale: 100}; renderForm();
    try {
      const buf = new Uint8Array(await f.arrayBuffer());
      const head = String.fromCharCode.apply(null, buf.slice(0, 1024));
      if (head.indexOf('%PDF') < 0) throw {user: /\.ai$/i.test(f.name)
        ? 'This .ai file has no PDF data inside. In Illustrator, use Save As, keep "Create PDF Compatible File" ticked, or save as PDF, then try again.'
        : 'This is not a PDF file. Choose a PDF or an Illustrator (.ai) file.'};
      const lib = await loadPdfjs();
      const r = await window.PatternImport.importPDF(lib, buf);
      if (!r.candidates.length) throw {user: 'No closed outlines were found. Check that the pattern lines are vector paths (not a scanned image) and that each piece is one closed line.'};
      draft.imp = {file: f.name, scale: 100, cands: r.candidates.map(c => ({
        group: c.group, name: c.name, qty: c.qty, wIn: c.wIn, hIn: c.hIn, outer: c.outer, sel: !c.outer,
        pts: c.norm.map(([u, v]) => u + ',' + v).join(' ')}))};
    } catch(e) {
      draft.imp = {file: f.name, scale: 100, cands: [], err: (e && e.user) || 'The file could not be read. It may be damaged or password-protected.'};
    }
    renderForm();
  };
  app.querySelectorAll('[data-impsel]').forEach(el => el.onchange = () => { draft.imp.cands[+el.dataset.impsel].sel = el.checked; renderForm(); });
  app.querySelectorAll('[data-impname]').forEach(el => el.oninput = () => { draft.imp.cands[+el.dataset.impname].name = el.value; });
  app.querySelectorAll('[data-impqty]').forEach(el => el.oninput = () => { draft.imp.cands[+el.dataset.impqty].qty = el.value; });
  app.querySelectorAll('[data-impgrp]').forEach(el => el.onclick = () => { const g = el.dataset.impgrp; draft.imp.cands.forEach(c => { c.sel = !c.outer && (!g || c.group === g); }); renderForm(); });
  const sc = app.querySelector('[data-impscale]');
  if (sc) sc.onchange = () => { const v = parseNum(sc.value); draft.imp.scale = v > 0 ? v : 100; renderForm(); };
  const cl = app.querySelector('[data-impclose]'); if (cl) cl.onclick = () => { draft.imp = null; renderForm(); };
  const add = app.querySelector('[data-impadd]');
  if (add) add.onclick = () => {
    const im = draft.imp, k = im.scale / 100, u = draft.unit;
    const val = inch => u === 'cm' ? String(+(inch * 2.54).toFixed(1)) : String(+inch.toFixed(2));
    const blank = dp => !dp.name.trim() && !dp.w.s && !dp.h.s;
    draft.pieces = draft.pieces.filter(dp => !blank(dp));
    im.cands.filter(c => c.sel).forEach(c => {
      const q = parseInt(c.qty, 10);
      draft.pieces.push({id: 'p' + rid(), name: c.name || '', shape: 'custom', pts: c.pts, src: im.file,
        w: {s: val(c.wIn * k), u}, h: {s: val(c.hIn * k), u}, params: {},
        cuts: [{m: 'kitenge', q: q > 0 ? String(q) : ''}], note: '', flag: q > 0 ? '' : 'Quantity was not written in the file.'});
    });
    const msg = `Shapes imported from ${im.file}${im.scale !== 100 ? ' at ' + im.scale + '%' : ''}: print one piece and check it with a ruler before cutting.`;
    if (!draft.flags.includes(msg)) draft.flags.push(msg);
    draft.imp = null; renderForm();
  };
}

async function photoData(prod){
  const url = photoSrc(prod); if (!url || !(prod.photo && prod.photo.url)) return null;
  try {
    const img = await new Promise((res, rej) => { const i = new Image(); i.crossOrigin = 'anonymous'; i.onload = () => res(i); i.onerror = rej; i.src = url; });
    const k = Math.min(1, 600 / Math.max(img.width, img.height));
    const c = document.createElement('canvas'); c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
    const g = c.getContext('2d'); g.fillStyle = '#fff'; g.fillRect(0, 0, c.width, c.height); g.drawImage(img, 0, 0, c.width, c.height);
    return {src: c.toDataURL('image/jpeg', 0.9), w: c.width, h: c.height};
  } catch(e) { return null; }
}

    el.addEventListener('click', go);
    el.addEventListener('keydown', e => { if (e.key==='Enter'||e.key===' ') { e.preventDefault(); go(); } });
  });
  app.querySelectorAll('.seg button').forEach(b => b.onclick = () => {
    if (b.dataset.v === 'all') { sel = null; form = null; } else if (!sel) sel = prod.pieces[0].id;
    render();
  });
  const bh = $('#backHome'); if (bh) bh.onclick = (e) => { e.preventDefault(); goHome(); };
  const ep = $('#editProd'); if (ep) ep.onclick = () => openProductForm(baseOf(prod.id));
  const z = $('#zoom');
  if (z) z.onclick = () => {
    const d = document.createElement('dialog');
    d.innerHTML = `<img src="${photoSrc(prod)}" alt="${esc(prod.name)} finished product"><button class="btn sec">Close</button>`;
    document.body.appendChild(d); d.showModal();
    d.querySelector('button').onclick = () => d.close();
    d.addEventListener('close', () => d.remove());
    d.addEventListener('click', e => { if (e.target === d) d.close(); });
  };
  app.querySelectorAll('[data-do]').forEach(b => b.onclick = async () => {
    const act = b.dataset.do;
    if (act === 'ask') { confirming = b.dataset.key; render(); const n = $('#cnote'); if (n) n.focus(); return; }
    if (act === 'cancel') { confirming = null; render(); return; }
    if (act === 'fix') { sel = b.dataset.pid; form = {pieceId: sel}; confirming = null; render(); $('#mat').scrollIntoView({block:'nearest'}); return; }
    if (act === 'close') { form = null; render(); return; }
    if (act === 'confirm') {
      const c = all.find(x => x.key === b.dataset.key), note = ($('#cnote') || {}).value || '';
      confirming = null; await guarded(() => confirmCheck(prod, c, note.trim())); render(); return;
    }
    if (act === 'reopen') { const c = all.find(x => x.key === b.dataset.key); await guarded(() => reopenCheck(prod, c)); render(); return; }
    if (act === 'reset') {
      const pid = form.pieceId; form = null;
      await guarded(async () => { await db.collection('overrides').doc(docId(prod.id, pid)).delete(); await addLog(prod.id, prod.pieces.find(p=>p.id===pid).name + ': values set back to the original'); });
      render(); return;
    }
    if (act === 'save') {
      const vals = {}; let bad = '';
      app.querySelectorAll('[data-f]').forEach(i => { const v = parseFloat(i.value); vals[i.dataset.f] = v;
        if (i.value === '' || isNaN(v) || v < 0) bad = 'Enter a number of 0 or more in every field.'; });
      const base = baseOf(prod.id).pieces.find(p => p.id === form.pieceId);
      if (!bad) {
        const inch = {}; fieldsFor(base).forEach(f => { inch[f.k.replace('shape.', '')] = vals[f.k] * (f.d.u === 'cm' ? 1/2.54 : 1); });
        bad = geomError(base.shape.type, inch, '');
        for (const k in vals) if (k.startsWith('cut.') && !Number.isInteger(vals[k])) bad = 'Quantities must be whole numbers.';
      }
      if (bad) { $('#ferr').textContent = bad.charAt(0).toUpperCase() + bad.slice(1); return; }
      const note = $('#fnote').value.trim(), pid = form.pieceId;
      form = null;
      await guarded(() => savePiece(prod, pid, vals, note)); render(); return;
    }
  });
  const st = $('#st');
  async function save(pieceId){
    if (!downloads) return;
    st.textContent = 'Preparing PDF...';
    const state = {checks: {}};
    Object.entries(ckFor(prod.id)).forEach(([k, r]) => { state.checks[k] = Object.assign({}, r, {byName: r.by || ''}); });
    const p2 = Object.assign({}, prod); const pd = await photoData(prod); if (pd) p2.photoData = pd;
    const doc = E.buildPDF(window.jspdf.jsPDF, p2, pieceId, state);
    const baseName = prod.name.replace(/[^A-Za-z0-9]+/g,'_').replace(/^_|_$/g,'') || 'Pattern';
    const fn = (pieceId ? `${baseName}_${pieceId}` : `${baseName}_Pattern`) + (open.length ? '_DRAFT' : '') + '.pdf';
    try { await downloads.save({filename: fn, data: doc.output('blob')}); st.textContent = 'Saved ' + fn + '. Print at 100% / Actual size.'; }
    catch (e) {
      const c = e && e.code;
      st.textContent = c === 'declined' ? 'Download cancelled.' : c === 'rate_limited' ? 'A save prompt is already open. Finish it, then try again.' : 'Download is not available in this view.';
    }
  }
  const a = $('#dlAll'); if (a) a.onclick = () => save(null);
  const o = $('#dlOne'); if (o) o.onclick = () => save(sel);
}

render();
})();

</script>
</body>
</html>
